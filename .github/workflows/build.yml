name: Build XPI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create releases
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The version comes only from the tag: v0.1.2 builds version 0.1.2.
      # Other builds are marked 0.0.0 so they can't be mistaken for a release.
      - name: Work out version
        id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ $REF == refs/tags/v* ]]; then
            version="${REF_NAME#v}"
            label="$version"
          else
            version="0.0.0"
            label="dev-${SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Syntax, locale and id checks, and the tests that don't need Zotero.
      - name: Offline checks
        run: |
          pip install -r test/requirements.txt
          python test/run_offline.py

      - name: Build
        run: bash build.sh "${{ steps.version.outputs.version }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: extra-columns-${{ steps.version.outputs.label }}
          path: |
            build/extra-columns.xpi
            build/updates.json
          if-no-files-found: error

      # Zotero reads updates.json from the latest release (the manifest's update_url)
      # to find new versions.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/extra-columns.xpi
            build/updates.json
          generate_release_notes: true
