name: Build XPI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # build.ps1 targets Windows PowerShell, so build on Windows.
    runs-on: windows-latest
    permissions:
      contents: write # needed to create releases
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The version comes only from the tag: v0.1.2 builds version 0.1.2.
      # Other builds are marked 0.0.0 so they can't be mistaken for a release.
      - name: Work out version
        id: version
        shell: powershell
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if ($env:REF -like 'refs/tags/v*') {
            $version = $env:REF_NAME.Substring(1)
            $label = $version
          }
          else {
            $version = "0.0.0"
            $label = "dev-" + $env:SHA.Substring(0, 7)
          }
          # Add-Content writes no byte-order mark, which would break the output names.
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "label=$label"

      - name: Build
        shell: powershell
        run: ./build.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: extra-columns-${{ steps.version.outputs.label }}
          path: |
            build/extra-columns.xpi
            build/updates.json
          if-no-files-found: error

      # Zotero reads updates.json from the latest release (the manifest's update_url)
      # to find new versions.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/extra-columns.xpi
            build/updates.json
          generate_release_notes: true
